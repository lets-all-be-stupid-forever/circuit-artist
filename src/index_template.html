<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Circuit Artist - WASM test</title>
    <link rel="icon" type="image/png" sizes="32x32" href="static/favicon.png">
    <style>
/* The game's own UI font. Converted from
   assets/font/ark-pixel-12px-proportional-latin.bdf (the file uifont.c loads)
   by tools/bdf2woff2.py, which turns each lit pixel into a square outline so it
   stays crisp instead of being autotraced into curves. Served from static/ next
   to the wasm by a configure_file() step -- CSS cannot read the MEMFS bundle.

   It is a 12px bitmap design, so ONLY multiples of 12px stay pixel-exact:
   12 / 24 / 36. Anything else (14px, 16px, 1em...) resamples and goes fuzzy.
   The game itself draws it at PIXEL_FONT_SCALE 2, i.e. 24px. */
@font-face {
  font-family: 'CA Pixel';
  src: url('static/ca-ui-font.woff2') format('woff2');
  /* block, not swap: a fallback flash would reflow at a different metric. */
  font-display: block;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  /* Keep the stack monospaced so a fallback still lines up roughly. */
  font-family: 'CA Pixel', ui-monospace, monospace;
  font-size: 24px;    /* 12 * PIXEL_FONT_SCALE, matching the in-game size */
  line-height: 32px;  /* 16px design line box * 2 */
  /* Non-standard but harmless: stops macOS greying the pixel edges. */
  -webkit-font-smoothing: none;
}

/* Form controls do not inherit font-family or font-size by default, so the
   select and buttons would otherwise stay in the browser's UI font. */
select, button, input, textarea {
  font: inherit;
}

/* Anything scaled from the game's pixel art must not be interpolated. */
canvas, img {
  image-rendering: pixelated;
}
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* The canvas is 100vh, so anything after it in normal flow starts below
         the fold and gets clipped by the overflow:hidden above. The overlay
         has to be taken out of flow -- positioning #tick alone would detach
         the number from its "Tick:" label and leave the button off-screen. */
      #ui {
        position: fixed;
        z-index: 200;
        left: 8px;
        top: 8px;
      }

      .panel {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
      }

      #steamBtn {
        position: fixed;
        top: 4px;
        right: 42px;
        z-index: 1000;            /* above the canvas */
        padding: 4px 10px;
          gap: 8px;  /* space between icon and text */

        background: #c8cca0;
        color: #000;
        /*font: bold 14px sans-serif;*/
        text-decoration: none;
        border: 2px solid #000;
        border-radius: 3px;
      }
      #steamBtn:hover { background: #e0e4b8; }


      #topLinks {
        position: fixed;
        top: 4px;
        right: 42px;
        z-index: 1000;            /* above the canvas */
        display: flex;
        align-items: center;      /* text and buttons share a midline */
        gap: 6px;                 /* space between the buttons */
      }
      #demoTag {
        color: #f8ffcb;           /* CA_WHITE in src/common.h */
        margin-right: 6px;
      }
      .topBtn {
        padding: 4px 10px;
        background: #c8cca0;
        color: #000;
        text-decoration: none;
        border: 2px solid #000;
        border-radius: 3px;
        font: inherit;
        cursor: pointer;
      }
      .topBtn:hover { background: #e0e4b8; }

    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <div id="topLinks">
        <a class="topBtn" href="https://circuitartistgame.com/2026/10/21/web-player/"
               target="_blank" rel="noopener">Blog Post</a>
        <a class="topBtn" href="https://github.com/lets-all-be-stupid-forever/circuit-artist"
               target="_blank" rel="noopener">GitHub</a>
          <a class="topBtn" href="https://store.steampowered.com/app/3139580/"
                 target="_blank" rel="noopener">Buy on Steam</a>
    </div>

    <script type="text/javascript">

      function setImgParam(imageUrl) {
          const pageUrl = new URL(window.location.href);
          pageUrl.searchParams.set('img', imageUrl);  
          history.replaceState(null, '', pageUrl);
      }

      function registerPaste(getCanPaste, loadPngBytes, loadFromUrl) {
        document.addEventListener('paste', async (e) => {
          if (!getCanPaste()) {
            return;
          }
          for (const item of e.clipboardData.items) {
            if (!item.type.startsWith('image/')) continue;
            // TODO: check item.type ==> might not be PNG
            e.preventDefault();
            const bytes = new Uint8Array(await item.getAsFile().arrayBuffer());
            loadPngBytes(bytes);
            break;
          }
          // 2. Otherwise, check for a URL
          const cd = e.clipboardData;
          const text = (cd.getData('text/uri-list') || cd.getData('text/plain')).trim();
          if (!text) return;
          let url;
          try {
            url = new URL(text);
          } catch {
            alert("Expected a valid URL")
            return;
          }

          if (url.protocol === 'http:' || url.protocol === 'https:') {
            loadFromUrl(url)
            setImgParam(url.href)
            e.preventDefault();
            // Module.ccall('OnUrlPasted', null, ['string'], [url.href]);
          }
        });
      }

      const IMG_PATH = '/startup.png';
      const imgUrl = new URLSearchParams(location.search).get('img');
      const lvl= new URLSearchParams(location.search).get('lvl');
      const args = []
      if (imgUrl) {
        args.push('--img', IMG_PATH);
      }
      if (lvl) {
        args.push('--lvl', lvl);
      }
      let initialMsg = null;

      var Module = {
        canvas: document.getElementById('canvas'),
        arguments: args,
        /* The build outputs live in static/. Without this, the .data preload
           resolves against the page URL (the file packager only honours
           locateFile, not the script's own directory) and 404s. */
        locateFile: (path) => 'static/' + path,

        preRun: [() => {
          if (!imgUrl) return;
          Module.addRunDependency('startup-img');
          fetch(imgUrl)
            .then(res => {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.arrayBuffer();
            })
            .then(buf => Module.FS.writeFile(IMG_PATH, new Uint8Array(buf)))
            .catch(err => {
              console.warn('Startup image failed:', err)
              initialMsg = 'Startup image failed to load';
            })
            .finally(() => Module.removeRunDependency('startup-img'));  
        }],
        onRuntimeInitialized() {
          const loadPng = Module.cwrap('ca_load_png', null, ['number', 'number']);
          const addMsg= Module.cwrap('ca_msg_add', null, ['string', 'number']);
          const getCanPaste = Module.cwrap('ca_get_can_paste', 'number', []);

          const loadFromUrl = async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const type = res.headers.get('content-type') || '';
            if (!type.startsWith('image/')) {
              alert('Not an image: ' + type)
              throw new Error('Not an image: ' + type);
            }
            loadPngBytes(new Uint8Array(await res.arrayBuffer()));
          };

          const loadPngBytes = (bytes) => {
            const ptr = Module._malloc(bytes.length);
            try {
              Module.HEAPU8.set(bytes, ptr);
              loadPng(ptr, bytes.length);
            } finally {
              Module._free(ptr);
            }
          };
          registerPaste(getCanPaste, loadPngBytes, loadFromUrl);
          if (initialMsg) {
            addMsg(initialMsg, 8);
          }
        }
      };
    </script>
    <script async type="text/javascript" src="static/ca_wasm.js"></script>
  </body>
</html>
