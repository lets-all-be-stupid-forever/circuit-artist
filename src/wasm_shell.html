<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Circuit Artist - WASM test</title>
    <style>
/* The game's own UI font. Converted from
   assets/font/ark-pixel-12px-proportional-latin.bdf (the file uifont.c loads)
   by tools/bdf2woff2.py, which turns each lit pixel into a square outline so it
   stays crisp instead of being autotraced into curves. Served from next to this
   page by a configure_file() step -- CSS cannot read the MEMFS bundle.

   It is a 12px bitmap design, so ONLY multiples of 12px stay pixel-exact:
   12 / 24 / 36. Anything else (14px, 16px, 1em...) resamples and goes fuzzy.
   The game itself draws it at PIXEL_FONT_SCALE 2, i.e. 24px. */
@font-face {
  font-family: 'CA Pixel';
  src: url('ca-ui-font.woff2') format('woff2');
  /* block, not swap: a fallback flash would reflow at a different metric. */
  font-display: block;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  /* Keep the stack monospaced so a fallback still lines up roughly. */
  font-family: 'CA Pixel', ui-monospace, monospace;
  font-size: 24px;    /* 12 * PIXEL_FONT_SCALE, matching the in-game size */
  line-height: 32px;  /* 16px design line box * 2 */
  /* Non-standard but harmless: stops macOS greying the pixel edges. */
  -webkit-font-smoothing: none;
}

/* Form controls do not inherit font-family or font-size by default, so the
   select and buttons would otherwise stay in the browser's UI font. */
select, button, input, textarea {
  font: inherit;
}

/* Anything scaled from the game's pixel art must not be interpolated. */
canvas, img {
  image-rendering: pixelated;
}
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* The canvas is 100vh, so anything after it in normal flow starts below
         the fold and gets clipped by the overflow:hidden above. The overlay
         has to be taken out of flow -- positioning #tick alone would detach
         the number from its "Tick:" label and leave the button off-screen. */
      #ui {
        position: fixed;
        z-index: 200;
        left: 8px;
        top: 8px;
      }

      .panel {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
      }

    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
      var Module = {
        canvas: document.getElementById('canvas'),
        onRuntimeInitialized() {
          const getTick     = Module.cwrap('ca_get_tick', 'number', []);
          const togglePause = Module.cwrap('ca_toggle_pause', 'number', []);
          const isPaused    = Module.cwrap('ca_is_paused', 'number', []);
          /* 'string' marshals the JS string into wasm memory for the duration
             of the call; the C side copies it, so nothing outlives the call. */
          const loadImage   = Module.cwrap('ca_load_image', null, ['string']);
          const loadPng     = Module.cwrap('ca_load_png', null, ['number', 'number']);
          const getMode     = Module.cwrap('ca_get_mode_name', 'string', []);

          //const REMOTE_PNG = 'https://i.imgur.com/rolTNUw.png';
          const REMOTE_PNG = 'https://upload.wikimedia.org/wikipedia/commons/5/5f/Oryctolagus_cuniculus_-_euqirneto_-_419737670_%28cropped%29.jpeg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original';

          /* Errors raised on the JS side have no PlayerMode to report them, and
             the poll below would overwrite the field on its next tick, so park
             them here and let the poll keep showing them until the next load. */
          let jsError = '';

          /* Hand an encoded PNG straight to C. No MEMFS write needed: the only
             reason to stage one would be to give raylib a path to open, and
             ca_load_png feeds LoadImageFromMemory instead. */
          const loadPngBytes = (bytes) => {
            const ptr = Module._malloc(bytes.length);
            try {
              /* Read Module.HEAPU8 *after* the malloc. ALLOW_MEMORY_GROWTH is
                 on, and growing the heap replaces the typed-array views, so a
                 view captured earlier would be detached and silently empty. */
              Module.HEAPU8.set(bytes, ptr);
              loadPng(ptr, bytes.length);
            } finally {
              /* ca_load_png copied the bytes, so this is safe right away. */
              Module._free(ptr);
            }
          };

          /* Fetch an encoded image over the network and hand the bytes to C. */
          const loadFromUrl = async (url) => {
            jsError = '';
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            loadPngBytes(new Uint8Array(await res.arrayBuffer()));
          };

          // fetchBtn.addEventListener('click', async () => {
          //   fetchBtn.disabled = true;
          //   try {
          //     await loadFromUrl(REMOTE_PNG);
          //   } catch (e) {
          //     jsError = 'fetch failed: ' + e.message;
          //   } finally {
          //     fetchBtn.disabled = false;
          //     fetchBtn.blur();
          //   }
          // });

          /* Drag an image onto the page to load it.

             Drops on the canvas need nothing here: emscripten's GLFW already
             listens for drop/dragover on it, writes the file into MEMFS and
             only then calls raylib's drop callback, which player.c picks up via
             IsFileDropped(). Touching those would double-load, so they are
             left strictly alone.

             The #ui panel overlays the canvas though, and GLFW never sees a
             drop that lands on it -- the browser would instead navigate to the
             image and take the page with it. Those go through the same byte
             path as "Load from URL". */
          const onCanvas = (e) => e.target === Module.canvas;
          window.addEventListener('dragover', (e) => {
            if (!onCanvas(e)) e.preventDefault();
          });
          window.addEventListener('drop', async (e) => {
            if (onCanvas(e)) return;
            e.preventDefault();
            const file = e.dataTransfer && e.dataTransfer.files[0];
            if (!file) return;
            jsError = '';
            try {
              loadPngBytes(new Uint8Array(await file.arrayBuffer()));
            } catch (err) {
              jsError = 'drop failed: ' + err.message;
            }
          });

          const wanted = new URLSearchParams(location.search).get('img');
          if (wanted && /^(https?:)?\/\//i.test(wanted)) {
            loadFromUrl(wanted).catch((e) => {
              /* Nearly always CORS: a cross-origin fetch needs
                 access-control-allow-origin from the far end, which most image
                 hosts do not send. The failure shows up in the State field. */
              jsError = 'img= failed: ' + e.message;
            });
          } else if (wanted) {
            const path = wanted.startsWith('/') ? wanted : '/assets/' + wanted;
            loadImage(path);
          } else {
            /* No ?img= at all: main() leaves MODE_EMPTY, so pick the first
               entry -- the JS side choosing, same as a change event would. */
            loadImage('/assets/example2.png');
          }
        }

      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
