<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Circuit Artist - WASM test</title>
    <style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* The canvas is 100vh, so anything after it in normal flow starts below
         the fold and gets clipped by the overflow:hidden above. The overlay
         has to be taken out of flow -- positioning #tick alone would detach
         the number from its "Tick:" label and leave the button off-screen. */
      #ui {
        position: fixed;
        z-index: 200;
        left: 8px;
        top: 8px;
      }

      .panel {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 14px/1.4 ui-monospace, monospace;
      }

    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="ui">
      <div class="panel">
        <select id="circuit"></select>
        <button id="pause">Pause</button>
        <button id="fetch">Load from URL</button>
        <div>Tick: <span id="tick">0</span></div>
        <div>State: <span id="mode">-</span></div>
      </div>
    </div>
    <script type="text/javascript">
      var Module = {
        canvas: document.getElementById('canvas'),
        onRuntimeInitialized() {
          const getTick     = Module.cwrap('ca_get_tick', 'number', []);
          const togglePause = Module.cwrap('ca_toggle_pause', 'number', []);
          const isPaused    = Module.cwrap('ca_is_paused', 'number', []);
          /* 'string' marshals the JS string into wasm memory for the duration
             of the call; the C side copies it, so nothing outlives the call. */
          const loadImage   = Module.cwrap('ca_load_image', null, ['string']);
          const loadPng     = Module.cwrap('ca_load_png', null, ['number', 'number']);
          const getMode     = Module.cwrap('ca_get_mode_name', 'string', []);

          const tickEl = document.getElementById('tick');
          const modeEl = document.getElementById('mode');
          const btn = document.getElementById('pause');
          const sel = document.getElementById('circuit');
          const fetchBtn = document.getElementById('fetch');

          const REMOTE_PNG = 'https://i.imgur.com/rolTNUw.png';

          /* Errors raised on the JS side have no PlayerMode to report them, and
             the poll below would overwrite the field on its next tick, so park
             them here and let the poll keep showing them until the next load. */
          let jsError = '';

          /* Hand an encoded PNG straight to C. No MEMFS write needed: the only
             reason to stage one would be to give raylib a path to open, and
             ca_load_png feeds LoadImageFromMemory instead. */
          const loadPngBytes = (bytes) => {
            const ptr = Module._malloc(bytes.length);
            try {
              /* Read Module.HEAPU8 *after* the malloc. ALLOW_MEMORY_GROWTH is
                 on, and growing the heap replaces the typed-array views, so a
                 view captured earlier would be detached and silently empty. */
              Module.HEAPU8.set(bytes, ptr);
              loadPng(ptr, bytes.length);
            } finally {
              /* ca_load_png copied the bytes, so this is safe right away. */
              Module._free(ptr);
            }
          };

          fetchBtn.addEventListener('click', async () => {
            fetchBtn.disabled = true;
            jsError = '';
            try {
              const res = await fetch(REMOTE_PNG);
              if (!res.ok) throw new Error('HTTP ' + res.status);
              loadPngBytes(new Uint8Array(await res.arrayBuffer()));
              sel.selectedIndex = -1;  /* no longer showing a bundled circuit */
            } catch (e) {
              jsError = 'fetch failed: ' + e.message;
            } finally {
              fetchBtn.disabled = false;
              fetchBtn.blur();
            }
          });

          /* List the .png files in the preloaded MEMFS tree, so the picker
             reflects what --preload-file actually baked in instead of a list
             kept in sync by hand. Only the dirs that hold circuits: a full
             walk of assets/ turns up ~60 files, nearly all achievement badges,
             toolbar icons and screenshots. */
          const CIRCUIT_DIRS = ['/assets', '/assets/default_blueprints',
                                '/assets/circuits'];
          for (const dir of CIRCUIT_DIRS) {
            let names;
            try {
              names = Module.FS.readdir(dir);
            } catch (e) {
              continue;  /* dir not in this bundle */
            }
            for (const name of names.sort()) {
              if (!name.endsWith('.png')) continue;
              const path = dir + '/' + name;
              sel.add(new Option(path.replace('/assets/', ''), path));
            }
          }

          sel.addEventListener('change', () => {
            jsError = '';
            loadImage(sel.value);
            sel.blur();
          });

          const setLabel = (paused) => {
            btn.textContent = paused ? 'Resume' : 'Pause';
          };

          btn.addEventListener('click', () => {
            /* ca_toggle_pause returns the new state, so the round trip into C
               and back is what drives the label -- no state kept in JS. */
            setLabel(togglePause());
            /* Drop focus, otherwise the button keeps swallowing the keys that
               GLFW wants on the canvas (K to pause, WASD to pan). */
            btn.blur();
          });

          setLabel(isPaused());
          setInterval(() => {
            tickEl.textContent = getTick();
            modeEl.textContent = jsError || getMode();
            /* Re-read rather than trust the last click: K on the canvas flips
               the same flag, and the label would otherwise go stale. */
            setLabel(isPaused());
          }, 100);

          /* Nothing is loaded at startup (main() leaves MODE_EMPTY), so pick
             the first entry -- this is the JS side choosing, same as a change
             event would. */
          if (sel.options.length) loadImage(sel.value);
        }
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
